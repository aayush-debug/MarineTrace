services:
  # ─────────────────────────────────────────────────
  # FastAPI Backend  →  http://localhost:8000
  # ─────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: marinetrace-backend:latest
    container_name: marinetrace-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override to use SQLite inside the container (no Postgres needed for demo)
      DATABASE_URL: "sqlite:///./slicktrace.db"
    volumes:
      # Mount only source code — NOT the whole /app dir (preserves pip-installed packages)
      - ./backend/app:/app/app
      - ./backend/ais:/app/ais
      - ./backend/drift:/app/drift
      - ./backend/attribution:/app/attribution
      - ./backend/data:/app/data
      # Persist the SQLite database across restarts
      - marinetrace_db:/app/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ping"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ─────────────────────────────────────────────────
  # Vite Frontend  →  http://localhost:5173
  # ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: marinetrace-frontend:latest
    container_name: marinetrace-frontend
    ports:
      - "5173:5173"
    volumes:
      # Hot-reload: mount only src so node_modules stays in the image
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/public:/app/public
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0

volumes:
  marinetrace_db:
    driver: local
