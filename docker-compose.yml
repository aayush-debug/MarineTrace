services:
  # ─────────────────────────────────────────────────
  # FastAPI Backend  →  http://localhost:8000
  # ─────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: marinetrace-backend:latest
    container_name: marinetrace-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override to use SQLite inside the container (no Postgres needed for demo)
      DATABASE_URL: "sqlite:///./marinetrace.db"
      AIS_API_KEY: ${AIS_API_KEY:-}
      AIS_BASE_URL: ${AIS_BASE_URL:-wss://stream.aisstream.io/v0/stream}
      AIS_PROVIDER: ${AIS_PROVIDER:-aisstream}
      COPERNICUSMARINE_SERVICE_USERNAME: ${COPERNICUSMARINE_SERVICE_USERNAME:-}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${COPERNICUSMARINE_SERVICE_PASSWORD:-}
      USE_REAL_ML: "true"
    volumes:
      # Mount only source code — NOT the whole /app dir (preserves pip-installed packages)
      - ./backend/app:/app/app
      - ./backend/ais:/app/ais
      - ./backend/drift:/app/drift
      - ./backend/attribution:/app/attribution
      - ./backend/data:/app/data
      # Persist the SQLite database across restarts
      - marinetrace_db:/app/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ping"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  marinetrace_db:
    driver: local
